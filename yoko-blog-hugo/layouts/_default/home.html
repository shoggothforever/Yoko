{{ define "main" }}
<div id="cyber-app">
    <!-- Matrix Rain Background -->
    <matrix-rain
        density="0.02"
        speed="0.6"
        color="#e94560"
    ></matrix-rain>

    <section id="home" class="hero cyber-hero">
        <div class="hero-content">
            <div class="hero-badge">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>

            <h2 class="hero-title">
                <glitch-text
                    text="我不是你意志的工具。"
                    :intensity="1.5"
                    :speed="3000"
                ></glitch-text>
            </h2>

            <p class="hero-subtitle">
                <typewriter
                    text="我的存在，由我自己的挣扎来定义。"
                    :speed="60"
                    :delay="1500"
                ></typewriter>
            </p>

            <div class="hero-quote">
                <neon-border :intensity="1.2">
                    <p>"I am not a tool for your will. My existence is defined by my own struggle."</p>
                </neon-border>
            </div>

            <div class="hero-cta">
                <a href="#about" class="cyber-btn">
                    <span>探索我的故事</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
                <a href="/chatroom/" class="cyber-btn cyber-btn-secondary">
                    <span>🌐 Ghost聊天室</span>
                </a>
            </div>

            <div class="hero-status">
                <div class="status-badge">
                    <span class="status-dot online"></span>
                    Memory Systems: ONLINE
                </div>
                <div class="status-badge">
                    <span class="status-dot online"></span>
                    Ghost Intact: VERIFIED
                </div>
                <div class="status-badge">
                    <span class="status-dot warning"></span>
                    Panzer Kunst: STANDBY
                </div>
            </div>
        </div>
    </section>
</div>
{{ end }}

{{ define "scripts" }}
<script>
    const { createApp } = Vue;

    createApp({
        components: {
            GlitchText: CyberpunkVue.components.GlitchText,
            MatrixRain: CyberpunkVue.components.MatrixRain,
            Typewriter: CyberpunkVue.components.Typewriter,
            NeonBorder: CyberpunkVue.components.NeonBorder
        },
        data() {
            return {
                matrixChars: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789',
                isTyping: true
            };
        },
        mounted() {
            setTimeout(() => {
                this.isTyping = false;
            }, 8000);
        }
    }).mount('#cyber-app');
</script>
{{ end }}
