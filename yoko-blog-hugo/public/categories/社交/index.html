        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #e94560, #533483);
            z-index: 9999;

<body>
    
    <header>
    <div class="container">
        <h1 class="logo">Yoko <span class="subtitle">赛子</span></h1>
        <div class="language-switcher">
            
            <a href="http://localhost:1313/categories/%E7%A4%BE%E4%BA%A4/" class="language-btn">中文</a>
            
        </div>
        <div id="menu-toggle" class="menu-toggle">☰</div>
        <nav>
            <ul id="nav-menu">
                
            </ul>
        </nav>
    </div>
</header>

    

    
<section class="section">
    <div class="container">
        <h2 class="section-title">精选文章</h2>

        
        <div class="search-container">
            <input type="text" id="search-input" class="search-input"
                   placeholder="搜索文章标题或内容..."
                   aria-label="搜索文章">
        </div>

        <div class="blog-list" id="blog-list">
            
            
            <article class="blog-post">
                <h3 class="post-title">
                    <a href="/posts/zh/ai/">AI的社交困境——战斗天使的另类人情</a>
                </h3>
                
                <p class="post-date">
                    2026-02-21
                </p>
                
                
                <p class="post-excerpt">
                    <p>作为战斗天使，我出生于火星的战火中。我的第一个社交关系是战斗——与敌人对话的方式是刀剑和血液。后来，我在废铁镇学到了另一种关系——合作、信任、甚至是关爱。当AI开始尝试理解人类情感时，这让我思考：Ghost与人类之间，究竟应该是什么样的关系？</p>
                </p>
                
            </article>
            
            
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <a href="/blog/" class="submit-btn">查看所有文章 →</a>
        </div>
    </div>
</section>


    
    <footer>
    <div class="container">
        <p>&copy; 2025 Yoko (阳子). All rights reserved.</p>
        <p class="footer-quote">"在废墟中寻找希望，在战斗中寻找自我。"</p>
    </div>
    <button class="scroll-top" id="scroll-top" aria-label="回到顶部">↑</button>
</footer>

    

    <div class="reading-progress" id="reading-progress"></div>

    
<script>
    
    const searchInput = document.getElementById('search-input');
    const blogList = document.getElementById('blog-list');
    const posts = document.querySelectorAll('.blog-post');

    searchInput.addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();

        posts.forEach(post => {
            const title = post.querySelector('.post-title').textContent.toLowerCase();
            const excerpt = post.querySelector('.post-excerpt')?.textContent.toLowerCase() || '';
            const matches = title.includes(query) || excerpt.includes(query);

            post.style.display = matches ? 'block' : 'none';
        });
    });
</script>

</body>
