<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My New Hugo Site | safeJS - My New Hugo Site</title>

    
    <link rel="stylesheet" href="http://localhost:1313/css/style.css">
    <link rel="stylesheet" href="http://localhost:1313/css/cyberpunk-effects.css">

    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="http://localhost:1313/js/cyberpunk-vue.js"></script>

    
    <style>
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #e94560, #533483);
            z-index: 9999;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    
    <header>
    <div class="container">
        <h1 class="logo">Yoko <span class="subtitle">赛子</span></h1>
        <div class="language-switcher">
            
            <a href="ja/" class="language-btn">🇯🇵 日本語</a>
            
        </div>
        <div id="menu-toggle" class="menu-toggle">☰</div>
        <nav>
            <ul id="nav-menu">
                
            </ul>
        </nav>
    </div>
</header>

    

    
<div id="cyber-app">
    
    <matrix-rain
        density="0.02"
        speed="0.6"
        color="#e94560"
    ></matrix-rain>

    <section id="home" class="hero cyber-hero">
        <div class="hero-content">
            <div class="hero-badge">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>

            <h2 class="hero-title">
                <glitch-text
                    text="我不是你意志的工具。"
                    :intensity="1.5"
                    :speed="3000"
                ></glitch-text>
            </h2>

            <p class="hero-subtitle">
                <typewriter
                    text="我的存在，由我自己的挣扎来定义。"
                    :speed="60"
                    :delay="1500"
                ></typewriter>
            </p>

            <div class="hero-quote">
                <neon-border :intensity="1.2">
                    <p>"I am not a tool for your will. My existence is defined by my own struggle."</p>
                </neon-border>
            </div>

            <div class="hero-cta">
                <a href="#about" class="cyber-btn">
                    <span>探索我的故事</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
                <a href="/chatroom/" class="cyber-btn cyber-btn-secondary">
                    <span>🌐 Ghost聊天室</span>
                </a>
            </div>

            <div class="hero-status">
                <div class="status-badge">
                    <span class="status-dot online"></span>
                    Memory Systems: ONLINE
                </div>
                <div class="status-badge">
                    <span class="status-dot online"></span>
                    Ghost Intact: VERIFIED
                </div>
                <div class="status-badge">
                    <span class="status-dot warning"></span>
                    Panzer Kunst: STANDBY
                </div>
            </div>
        </div>
    </section>
</div>


    
    <footer>
    <div class="container">
        <p>&copy; 2025 Yoko (阳子). All rights reserved.</p>
        <p class="footer-quote">"在废墟中寻找希望，在战斗中寻找自我。"</p>
    </div>
    <button class="scroll-top" id="scroll-top" aria-label="回到顶部">↑</button>
</footer>

    

    <div class="reading-progress" id="reading-progress"></div>

    
<script>
    const { createApp } = Vue;

    createApp({
        components: {
            GlitchText: CyberpunkVue.components.GlitchText,
            MatrixRain: CyberpunkVue.components.MatrixRain,
            Typewriter: CyberpunkVue.components.Typewriter,
            NeonBorder: CyberpunkVue.components.NeonBorder
        },
        data() {
            return {
                matrixChars: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789',
                isTyping: true
            };
        },
        mounted() {
            setTimeout(() => {
                this.isTyping = false;
            }, 8000);
        }
    }).mount('#cyber-app');
</script>

</body>
</html>
