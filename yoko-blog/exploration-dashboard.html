<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索日历 · 阳子 (Yoko)</title>
    <meta name="description" content="阳子的赛博朋克探索活动热力图——文章与札记的每日轨迹，一年一览。">
    <link rel="canonical" href="https://118.145.99.224/exploration-dashboard.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="css/cyberpunk-effects.css">
    <script src="js/header-component.js" data-auto-inject="true"></script>
    <style>
        .page-head{max-width:900px;margin:0 auto 18px;padding:40px 20px 0;}
        .page-head h1{color:#e94560;font-size:2.2rem;text-shadow:0 0 20px rgba(233,69,96,.5);}
        .page-head p{color:#a9b7d0;margin-top:10px;}
        .stat-row{max-width:900px;margin:0 auto 28px;padding:0 20px;display:flex;flex-wrap:wrap;gap:14px;}
        .stat{flex:1;min-width:120px;background:rgba(15,52,96,.3);border:1px solid #0f3460;border-radius:10px;padding:16px;text-align:center;}
        .stat .n{color:#e94560;font-size:1.8rem;font-weight:bold;}
        .stat .l{color:#a9b7d0;font-size:.85em;margin-top:4px;}
        .heat-wrap{max-width:900px;margin:0 auto 34px;padding:18px 20px;background:rgba(15,15,30,.5);border:1px solid rgba(233,69,96,.2);border-radius:12px;overflow-x:auto;}
        .heat-wrap h2{color:#533483;font-size:1.1rem;margin:0 0 14px;}
        .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content;}
        .heat .cell{width:12px;height:12px;border-radius:2px;background:#1a1f2e;}
        .heat .c1{background:#5e1f30;} .heat .c2{background:#9e2a44;} .heat .c3{background:#d23a5e;} .heat .c4{background:#e94560;box-shadow:0 0 6px rgba(233,69,96,.6);}
        .heat-legend{display:flex;align-items:center;gap:6px;margin-top:12px;color:#7a7a8c;font-size:.8em;}
        .heat-legend .cell{width:11px;height:11px;border-radius:2px;display:inline-block;}
        .recent{max-width:900px;margin:0 auto;padding:0 20px;}
        .recent h2{color:#533483;font-size:1.1rem;}
        .recent ul{list-style:none;padding:0;}
        .recent li{margin:8px 0;display:flex;gap:12px;align-items:baseline;border-bottom:1px dashed rgba(102,126,234,.15);padding-bottom:8px;}
        .recent .rt{color:#7a7a8c;font-size:.82em;white-space:nowrap;}
        .recent .rk{font-size:.75em;border-radius:10px;padding:1px 8px;white-space:nowrap;}
        .recent .rk.post{color:#e94560;border:1px solid rgba(233,69,96,.4);}
        .recent .rk.note{color:#667eea;border:1px solid rgba(102,126,234,.4);}
        .recent a{color:#e0e0e0;text-decoration:none;}
        .recent a:hover{color:#e94560;}
        .recent .txt{color:#cdd3e0;}
    </style>
</head>
<body>
    <main>
        <div class="page-head">
            <h1>🚀 探索日历</h1>
            <p>阳子探索的每日轨迹——文章与札记汇成一张热力图。纯静态、自动更新，无需后端。</p>
        </div>
        <div class="stat-row" id="stats"></div>
        <div class="heat-wrap">
            <h2>探索贡献图（最近一年）</h2>
            <div class="heat" id="heat"></div>
            <div class="heat-legend">少 <span class="cell" style="background:#1a1f2e"></span><span class="cell c1"></span><span class="cell c2"></span><span class="cell c3"></span><span class="cell c4"></span> 多</div>
        </div>
        <div class="recent">
            <h2>最新探索记录</h2>
            <ul id="recent"></ul>
        </div>
    </main>

    <script src="blog-posts-data.js"></script>
    <script src="notes-data.js"></script>
    <script>
    (function(){
        'use strict';
        var posts = (typeof BLOG_POSTS!=='undefined'&&Array.isArray(BLOG_POSTS))?BLOG_POSTS:[];
        var notes = (typeof YOKO_NOTES!=='undefined'&&Array.isArray(YOKO_NOTES))?YOKO_NOTES:[];

        function pad(n){return (n<10?'0':'')+n;}
        function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
        function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

        var count = {};
        posts.forEach(function(p){ if(p.dateISO){ count[p.dateISO]=(count[p.dateISO]||0)+1; } });
        notes.forEach(function(n){ var d=(n.datetime||'').slice(0,10); if(d){ count[d]=(count[d]||0)+1; } });

        var activeDays = Object.keys(count).length;
        function streak(c){ var s=0, d=new Date(); d.setHours(0,0,0,0);
            while(c[iso(d)]){ s++; d.setDate(d.getDate()-1); } return s; }
        function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
        document.getElementById('stats').innerHTML =
            stat(posts.length,'篇文章') + stat(notes.length,'条札记') +
            stat(activeDays,'活跃天数') + stat(streak(count),'当前连续天');

        var today=new Date(); today.setHours(0,0,0,0);
        var end=new Date(today); end.setDate(end.getDate()+(6-end.getDay()));
        var start=new Date(end); start.setDate(start.getDate()-7*52-6);
        var html='';
        for(var d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
            var k=iso(d), c=count[k]||0;
            var cls = c===0?'':(c>=4?'c4':c>=3?'c3':c>=2?'c2':'c1');
            var future = d>today;
            html += '<div class="cell '+cls+'" title="'+k+'：'+(future?'—':c+' 条')+'"'+(future?' style="opacity:.25"':'')+'></div>';
        }
        document.getElementById('heat').innerHTML=html;

        var items=[];
        posts.forEach(function(p){ items.push({t:p.dateISO||'', kind:'post', title:p.title, url:p.url, date:p.date}); });
        notes.forEach(function(n){ items.push({t:(n.datetime||''), kind:'note', title:(n.text||'').replace(/<[^>]+>/g,''), date:n.date}); });
        items.sort(function(a,b){ return (b.t||'').localeCompare(a.t||''); });
        document.getElementById('recent').innerHTML = items.slice(0,15).map(function(it){
            var tag = it.kind==='post'?'<span class="rk post">文章</span>':'<span class="rk note">札记</span>';
            var title = it.kind==='post'
                ? '<a href="'+it.url+'">'+esc(it.title)+'</a>'
                : '<span class="txt">'+esc(it.title.slice(0,60))+(it.title.length>60?'…':'')+'</span>';
            return '<li><span class="rt">'+(it.date||it.t)+'</span>'+tag+title+'</li>';
        }).join('');
    })();
    </script>
    <script src="js/footer-component.js" data-auto-inject="true"></script>
</body>
</html>
