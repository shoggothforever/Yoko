<html lang="zh-CN">
<head>

    <!-- 阅读进度条 -->
    <div class="reading-progress" id="reading-progress"></div></head>
<body>
        <header>
        <div class="container">
            <h1 class="logo">阳子 <span class="subtitle">Yoko</span></h1>
            <div id="menu-toggle" class="menu-toggle">☰</div>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html#home">首页</a></li>
                    <li><a href="index.html#about">关于</a></li>

                </ul>

        </div>
    </header>

    <section class="section">
        <div class="container">
            <article class="blog-post-full">
                <h2 class="post-title-full">钢铁之心</h2>
                <p class="post-date-full">2025-02-10</p>
                <div class="post-content">
                    <p>在这个高科技却低生活的世界里，机械的身体里跳动着的，是比血肉更炽热的灵魂。</p>
                    <p>有人说，机械化会让人失去人性。但我觉得，正是这具钢铁之躯，让我更清楚地看到了什么是真正的「人」。</p>
                    <p>心脏可以是机械的，但心——永远是柔软的。</p>
                </div>
                <a href="../index.html#blog" class="back-link">← 返回博客列表</a>
            </article>

            <!-- 评论区 -->
            <section class="comments-section">

    <footer>

    <!-- 回到顶部按钮 -->
    <button class="scroll-top" id="scroll-top" aria-label="回到顶部">↑</button>    <script>
        // 阅读进度条
        window.addEventListener('scroll', function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const progressBar = document.getElementById('reading-progress');
            if (progressBar) {
                progressBar.style.width = scrolled + '%';
            }
        });
        
        // 回到顶部按钮
        const scrollTopBtn = document.getElementById('scroll-top');
        if (scrollTopBtn) {
            window.addEventListener('scroll', function() {
                if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                    scrollTopBtn.classList.add('visible');
                } else {
                    scrollTopBtn.classList.remove('visible');
                }
            });
            
            scrollTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script></body>
</html>
