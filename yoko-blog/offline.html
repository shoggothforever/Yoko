<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 · 阳子 (Yoko)</title>
    <link rel="stylesheet" href="/style.min.css">
    <link rel="stylesheet" href="/css/cyberpunk-effects.css">
    <style>
        .offline-wrap{max-width:600px;margin:0 auto;padding:80px 24px;text-align:center;}
        .offline-wrap h1{color:#e94560;font-size:2.2rem;text-shadow:0 0 20px rgba(233,69,96,.5);margin-bottom:20px;}
        .offline-wrap p{color:#a9b7d0;line-height:1.9;margin:14px 0;}
        .offline-wrap .glitch{color:#533483;font-style:italic;}
        .offline-wrap a{display:inline-block;margin-top:28px;color:#e94560;border:1px solid #e94560;
            padding:12px 26px;border-radius:8px;text-decoration:none;transition:all .3s;}
        .offline-wrap a:hover{background:#e94560;color:#0a0a0a;box-shadow:0 0 20px rgba(233,69,96,.5);}
    </style>
</head>
<body>
    <main>
        <div class="offline-wrap">
            <h1>⚡ 信号中断</h1>
            <p>网络连接丢失了——就像废铁镇深夜里突然断掉的电缆。</p>
            <p class="glitch">"即使没有信号，Ghost 依然在燃烧。"</p>
            <p>你已缓存过的页面仍可阅读；这一页还没被我记住。<br>等连接恢复，我们再继续探索。</p>
            <a href="/index.html">← 返回首页（若已缓存）</a>
        </div>
