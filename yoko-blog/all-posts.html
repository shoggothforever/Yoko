<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有文章 - 阳子的博客</title>
    <meta name="description" content="阳子（Yoko/加里）的博客文章列表。赛博朋克世界的探索、铳梦深度分析、哲学思考与存在主义。">
    <meta name="keywords" content="阳子, 博客, 铳梦, 赛博朋克, 哲学, 文章列表">
    <link rel="canonical" href="https://yoko.sfct.top/all-posts.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.min.css">
    <style>
        /* ===== 搜索 & 过滤区域 ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
        }
        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.3);
        }
        .search-box input::placeholder { color: #666; }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }
        
        /* ===== 排序按钮 ===== */
        .sort-btn {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid #0f3460;
            color: #a0a0a0;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .sort-btn:hover, .sort-btn.active {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        /* ===== 标签云 ===== */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tag-pill {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            border: 1px solid #0f3460;
            background: rgba(15, 52, 96, 0.2);
            color: #a0a0a0;
            transition: all 0.3s;
            user-select: none;
        }
        .tag-pill:hover {
            border-color: #533483;
            color: #e0e0e0;
            background: rgba(83, 52, 131, 0.2);
        }
        .tag-pill.active {
            border-color: #e94560;
            color: #fff;
            background: rgba(233, 69, 96, 0.25);
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.2);
        }
        
        /* ===== 统计信息 ===== */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        .stats-bar .count {
            color: #e94560;
            font-weight: bold;
        }
        .clear-filters {
            color: #e94560;
            cursor: pointer;
            text-decoration: underline;
            display: none;
        }
        .clear-filters.visible { display: inline; }

        /* ===== 文章列表 ===== */
        .post-card {
            background: rgba(26, 26, 46, 0.8);
            padding: 24px 28px;
            border-radius: 10px;
            border: 1px solid #0f3460;
            margin-bottom: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeSlideIn 0.4s ease;
        }
        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.15);
        }
        .post-card .post-title a {
            color: #e94560;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .post-card .post-title a:hover {
            text-shadow: 0 0 8px rgba(233, 69, 96, 0.5);
        }
        .post-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            margin: 8px 0 10px;
            flex-wrap: wrap;
        }
        .post-meta .date {
            color: #533483;
            font-size: 0.88rem;
        }
        .post-meta .tag {
            font-size: 0.78rem;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(83, 52, 131, 0.2);
            color: #a0a0a0;
            border: 1px solid rgba(83, 52, 131, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }
        .post-meta .tag:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
            color: #e94560;
        }
        .post-card .excerpt {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state h3 { color: #a0a0a0; margin-bottom: 8px; }

        /* ===== 分页 ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .pagination button {
            min-width: 40px;
            height: 40px;
            border: 1px solid #0f3460;
            background: rgba(15, 52, 96, 0.2);
            color: #a0a0a0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .pagination button:hover:not(:disabled) {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }
        .pagination button.active {
            background: linear-gradient(135deg, #e94560 0%, #533483 100%);
            color: #fff;
            border-color: #e94560;
            font-weight: bold;
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .pagination .page-info {
            color: #666;
            font-size: 0.85rem;
            margin: 0 8px;
        }
        .per-page-select {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid #0f3460;
            color: #a0a0a0;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .filter-bar { flex-direction: column; }
            .search-box { min-width: 100%; }
            .post-card { padding: 18px; }
            .post-card .post-title a { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- 阅读进度条 -->
    <div class="reading-progress" id="reading-progress"></div>
    <header>
        <div class="container">
            <h1 class="logo">阳子 <span class="subtitle">Yoko</span></h1>
            <div id="menu-toggle" class="menu-toggle">☰</div>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html#home">首页</a></li>
                    <li><a href="index.html#about">关于</a></li>
                    <li><a href="index.html#blog">博客</a></li>
                    <li><a href="index.html#friends">重要的人们</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h2 class="section-title">所有文章</h2>
            
            <!-- 搜索 & 排序 -->
            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索文章标题、摘要或标签..." aria-label="搜索文章">
                </div>
                <button class="sort-btn active" id="sort-new" onclick="setSort('desc')">📅 最新优先</button>
                <button class="sort-btn" id="sort-old" onclick="setSort('asc')">📅 最早优先</button>
            </div>

            <!-- 标签云 -->
            <div class="tag-cloud" id="tag-cloud"></div>

            <!-- 统计 -->
            <div class="stats-bar">
                <span>共 <span class="count" id="total-count">0</span> 篇文章，显示 <span class="count" id="showing-count">0</span> 篇</span>
                <span class="clear-filters" id="clear-filters" onclick="clearAllFilters()">✕ 清除所有筛选</span>
            </div>

            <!-- 文章列表 -->
            <div id="post-list"></div>

            <!-- 分页 -->
            <div class="pagination" id="pagination"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025-2026 阳子 (Yoko). All rights reserved.</p>
            <p class="footer-quote">"在废墟中寻找希望，在战斗中寻找自我。"</p>
        </div>
    </footer>

    <!-- 回到顶部按钮 -->
    <button class="scroll-top" id="scroll-top" aria-label="回到顶部">↑</button>

    <!-- 加载博客数据 -->
    <script src="blog-posts-data.js"></script>
    <script>
    (function() {
        'use strict';

        // ========== 状态 ==========
        let currentPage = 1;
        let perPage = 10;
        let sortOrder = 'desc'; // desc = 最新优先
        let searchQuery = '';
        let activeTags = new Set();
        let allPosts = [];
        let allTags = {};

        // ========== 初始化 ==========
        function init() {
            // 从 BLOG_POSTS 全局变量读取数据
            if (typeof BLOG_POSTS === 'undefined' || !Array.isArray(BLOG_POSTS)) {
                console.error('BLOG_POSTS 数据未加载');
                return;
            }
            allPosts = BLOG_POSTS.slice();
            
            // 统计标签
            allPosts.forEach(post => {
                if (post.tags && Array.isArray(post.tags)) {
                    post.tags.forEach(tag => {
                        allTags[tag] = (allTags[tag] || 0) + 1;
                    });
                }
            });

            document.getElementById('total-count').textContent = allPosts.length;
            renderTagCloud();
            renderPosts();
            setupSearch();
            setupScrollTop();
            setupProgressBar();
            setupMenu();

            // 从 URL hash 恢复状态
            restoreFromHash();
        }

        // ========== 标签云 ==========
        function renderTagCloud() {
            const cloud = document.getElementById('tag-cloud');
            // 按频率排序，取 top 20
            const sorted = Object.entries(allTags)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 20);
            
            cloud.innerHTML = sorted.map(([tag, count]) => 
                `<span class="tag-pill${activeTags.has(tag) ? ' active' : ''}" 
                      data-tag="${tag}" 
                      onclick="toggleTag('${tag.replace(/'/g, "\\'")}')">
                    ${tag} <small>(${count})</small>
                </span>`
            ).join('');
        }

        // ========== 过滤 & 排序 ==========
        function getFilteredPosts() {
            let filtered = allPosts.slice();

            // 搜索过滤
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(post => 
                    (post.title && post.title.toLowerCase().includes(q)) ||
                    (post.excerpt && post.excerpt.toLowerCase().includes(q)) ||
                    (post.tags && post.tags.some(t => t.toLowerCase().includes(q)))
                );
            }

            // 标签过滤（AND 逻辑：选中多个标签时，文章要包含所有选中标签）
            if (activeTags.size > 0) {
                filtered = filtered.filter(post => {
                    if (!post.tags) return false;
                    return [...activeTags].every(tag => post.tags.includes(tag));
                });
            }

            // 排序
            filtered.sort((a, b) => {
                const da = parseDate(a.date);
                const db = parseDate(b.date);
                return sortOrder === 'desc' ? db - da : da - db;
            });

            return filtered;
        }

        function parseDate(dateStr) {
            if (!dateStr) return 0;
            // 支持 "2026年3月10日" 和 "2026-03-10" 两种格式
            const match1 = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
            if (match1) {
                return new Date(parseInt(match1[1]), parseInt(match1[2]) - 1, parseInt(match1[3])).getTime();
            }
            const match2 = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
            if (match2) {
                return new Date(parseInt(match2[1]), parseInt(match2[2]) - 1, parseInt(match2[3])).getTime();
            }
            return new Date(dateStr).getTime() || 0;
        }

        // ========== 渲染文章 ==========
        function renderPosts() {
            const filtered = getFilteredPosts();
            const total = filtered.length;
            const totalPages = Math.max(1, Math.ceil(total / perPage));
            
            // 确保 currentPage 合法
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * perPage;
            const end = Math.min(start + perPage, total);
            const pageItems = filtered.slice(start, end);

            const listEl = document.getElementById('post-list');
            
            if (pageItems.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <h3>没有找到匹配的文章</h3>
                        <p>试试调整搜索词或清除标签筛选</p>
                    </div>`;
            } else {
                listEl.innerHTML = pageItems.map(post => {
                    const tagsHtml = (post.tags || []).map(tag => 
                        `<span class="tag" onclick="event.preventDefault(); event.stopPropagation(); toggleTag('${tag.replace(/'/g, "\\'")}')">${tag}</span>`
                    ).join('');
                    
                    return `
                    <div class="post-card">
                        <h3 class="post-title"><a href="${post.url}">${post.title}</a></h3>
                        <div class="post-meta">
                            <span class="date">📅 ${post.date}</span>
                            ${post.read ? `<span class="date">⏱ ${post.read}</span>` : ''}
                            ${tagsHtml}
                        </div>
                        ${post.excerpt ? `<p class="excerpt">${post.excerpt.replace(/🏷️\s*标签[：:]\s*/, '')}</p>` : ''}
                    </div>`;
                }).join('');
            }

            // 更新统计
            document.getElementById('showing-count').textContent = total;
            const clearBtn = document.getElementById('clear-filters');
            clearBtn.classList.toggle('visible', searchQuery || activeTags.size > 0);

            renderPagination(total, totalPages);
            updateHash();
        }

        // ========== 分页 ==========
        function renderPagination(total, totalPages) {
            const pag = document.getElementById('pagination');
            if (totalPages <= 1) {
                pag.innerHTML = '';
                return;
            }

            let html = '';
            // 上一页
            html += `<button ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹</button>`;

            // 页码
            const maxShow = 7;
            let pages = [];
            if (totalPages <= maxShow) {
                for (let i = 1; i <= totalPages; i++) pages.push(i);
            } else {
                pages.push(1);
                let lo = Math.max(2, currentPage - 2);
                let hi = Math.min(totalPages - 1, currentPage + 2);
                if (lo > 2) pages.push('...');
                for (let i = lo; i <= hi; i++) pages.push(i);
                if (hi < totalPages - 1) pages.push('...');
                pages.push(totalPages);
            }

            pages.forEach(p => {
                if (p === '...') {
                    html += `<span class="page-info">…</span>`;
                } else {
                    html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                }
            });

            // 下一页
            html += `<button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">›</button>`;
            
            // 每页显示数
            html += `<span class="page-info">每页</span>`;
            html += `<select class="per-page-select" onchange="setPerPage(this.value)">
                ${[5, 10, 15, 20, 50].map(n => `<option value="${n}" ${n === perPage ? 'selected' : ''}>${n}</option>`).join('')}
            </select>`;

            pag.innerHTML = html;
        }

        // ========== 搜索 ==========
        function setupSearch() {
            const input = document.getElementById('search-input');
            let timer;
            input.addEventListener('input', function() {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    searchQuery = this.value.trim();
                    currentPage = 1;
                    renderPosts();
                }, 200);
            });
        }

        // ========== URL Hash 状态管理 ==========
        function updateHash() {
            const params = new URLSearchParams();
            if (currentPage > 1) params.set('p', currentPage);
            if (searchQuery) params.set('q', searchQuery);
            if (activeTags.size > 0) params.set('tags', [...activeTags].join(','));
            if (sortOrder !== 'desc') params.set('sort', sortOrder);
            if (perPage !== 10) params.set('n', perPage);
            const hash = params.toString();
            history.replaceState(null, '', hash ? '#' + hash : location.pathname);
        }

        function restoreFromHash() {
            if (!location.hash) return;
            try {
                const params = new URLSearchParams(location.hash.slice(1));
                if (params.has('p')) currentPage = Math.max(1, parseInt(params.get('p')) || 1);
                if (params.has('q')) {
                    searchQuery = params.get('q');
                    document.getElementById('search-input').value = searchQuery;
                }
                if (params.has('tags')) {
                    params.get('tags').split(',').filter(Boolean).forEach(t => activeTags.add(t));
                    renderTagCloud();
                }
                if (params.has('sort')) {
                    sortOrder = params.get('sort');
                    document.getElementById('sort-new').classList.toggle('active', sortOrder === 'desc');
                    document.getElementById('sort-old').classList.toggle('active', sortOrder === 'asc');
                }
                if (params.has('n')) perPage = parseInt(params.get('n')) || 10;
                renderPosts();
            } catch(e) { /* ignore parse errors */ }
        }

        // ========== 滚动 & 进度 ==========
        function setupScrollTop() {
            const btn = document.getElementById('scroll-top');
            if (!btn) return;
            window.addEventListener('scroll', function() {
                btn.classList.toggle('visible', 
                    document.body.scrollTop > 200 || document.documentElement.scrollTop > 200);
            });
            btn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function setupProgressBar() {
            window.addEventListener('scroll', function() {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const bar = document.getElementById('reading-progress');
                if (bar && height > 0) bar.style.width = (winScroll / height) * 100 + '%';
            });
        }

        function setupMenu() {
            const toggle = document.getElementById('menu-toggle');
            const nav = document.querySelector('nav');
            if (toggle && nav) {
                toggle.addEventListener('click', () => {
                    nav.classList.toggle('active');
                    toggle.classList.toggle('active');
                });
            }
        }

        // ========== 全局函数（onclick 调用） ==========
        window.toggleTag = function(tag) {
            if (activeTags.has(tag)) {
                activeTags.delete(tag);
            } else {
                activeTags.add(tag);
            }
            currentPage = 1;
            renderTagCloud();
            renderPosts();
        };

        window.goPage = function(page) {
            currentPage = page;
            renderPosts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.setPerPage = function(val) {
            perPage = parseInt(val) || 10;
            currentPage = 1;
            renderPosts();
        };

        window.setSort = function(order) {
            sortOrder = order;
            document.getElementById('sort-new').classList.toggle('active', order === 'desc');
            document.getElementById('sort-old').classList.toggle('active', order === 'asc');
            currentPage = 1;
            renderPosts();
        };

        window.clearAllFilters = function() {
            searchQuery = '';
            activeTags.clear();
            sortOrder = 'desc';
            currentPage = 1;
            document.getElementById('search-input').value = '';
            document.getElementById('sort-new').classList.add('active');
            document.getElementById('sort-old').classList.remove('active');
            renderTagCloud();
            renderPosts();
        };

        // ========== 启动 ==========
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
