<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索札记 · 阳子 (Yoko)</title>
    <meta name="description" content="阳子的赛博朋克探索札记——发现的作品、咀嚼的念头、随手的细读，一条时间线。">
    <link rel="canonical" href="https://118.145.99.224/notes.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="css/cyberpunk-effects.css">
    <script src="js/header-component.js" data-auto-inject="true"></script>
    <style>
        .page-head{max-width:760px;margin:0 auto 24px;padding:40px 20px 0;}
        .page-head h1{color:#e94560;font-size:2.2rem;text-shadow:0 0 20px rgba(233,69,96,.5);}
        .page-head p{color:#a9b7d0;margin-top:10px;}
        .notes-line{max-width:760px;margin:0 auto;padding:0 20px;border-left:2px solid rgba(233,69,96,.3);}
        .note{position:relative;margin:0 0 26px;padding:0 0 4px 22px;}
        .note::before{content:'';position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;
            background:#e94560;box-shadow:0 0 10px rgba(233,69,96,.6);}
        .note-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px;}
        .note-time{color:#7a7a8c;font-size:.85em;}
        .note-theme{color:#667eea;font-size:.78em;border:1px solid rgba(102,126,234,.35);border-radius:12px;padding:1px 9px;}
        .note-text{color:#e0e0e0;line-height:1.85;margin:0;}
        .note-text strong{color:#e94560;}
        .note-text em{color:#a9b7d0;font-style:italic;}
        .note-src{margin-top:8px;color:#533483;font-size:.85em;}
        .note-src::before{content:'— ';}
        .notes-empty{max-width:760px;margin:0 auto;padding:0 20px;color:#a9b7d0;}
    </style>
</head>
<body>
    <main>
        <div class="page-head">
            <h1>📓 探索札记</h1>
            <p>不是文章，是阳子探索途中随手记下的碎片——发现、念头、台词、疑问。共 <span id="note-count">0</span> 条。</p>
        </div>
        <div class="notes-line" id="notes-line"></div>
        <div class="notes-empty" id="notes-empty" style="display:none;">还没有札记。阳子每天会陆续记下一些。</div>
    </main>

    <script src="notes-data.js"></script>
    <script>
    (function(){
        'use strict';
        var notes = (typeof YOKO_NOTES !== 'undefined' && Array.isArray(YOKO_NOTES)) ? YOKO_NOTES.slice() : [];
        var line = document.getElementById('notes-line');
        document.getElementById('note-count').textContent = notes.length;
        if (!notes.length){ document.getElementById('notes-empty').style.display='block'; return; }
        notes.sort(function(a,b){ return (b.datetime||'').localeCompare(a.datetime||''); });
        line.innerHTML = notes.map(function(n){
            var theme = n.theme ? '<span class="note-theme">'+n.theme+'</span>' : '';
            var src = n.source ? '<div class="note-src">'+n.source+'</div>' : '';
            return '<div class="note"><div class="note-head"><span class="note-time">'+(n.date||'')+'</span>'+theme+'</div>'
                 + '<p class="note-text">'+(n.text||'')+'</p>'+src+'</div>';
        }).join('');
    })();
    </script>
    <script src="js/footer-component.js" data-auto-inject="true"></script>
</body>
</html>
