<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 - Ghost聊天室</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        .test-section {
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .test-title {
            color: #e94560;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .topic-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }
        .start-btn {
            background: linear-gradient(135deg, #e94560 0%, #533483 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #0f3460;
            border-radius: 8px;
            display: none;
        }
        .success {
            color: #00ff00;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="test-section">
        <h1 class="test-title">🧪 Ghost聊天室功能测试</h1>
        <p>这是一个简单的测试页面，验证核心JavaScript逻辑是否正常工作。</p>
        
        <input type="text" id="test-topic" class="topic-input" 
               placeholder="输入测试话题，例如：'记忆和灵魂的区别是什么？'">
        <button class="start-btn" id="test-btn">点击测试</button>
        
        <div id="test-result" class="result">
            <p class="success">✅ 测试成功！JavaScript正常工作！</p>
            <p id="test-topic-display"></p>
            <p id="test-rounds-display"></p>
        </div>
    </div>
    
    <script>
        console.log('测试页面加载...');
        
        // 简化的测试数据
        const testData = {
            rounds: [
                { speaker: 'gally', name: '阳子 / Gally', icon: '⚔️', content: '测试内容1' },
                { speaker: 'motoko', name: '草薙素子 / Motoko', icon: '🌐', content: '测试内容2' },
            ],
            conclusion: ['测试结论1', '测试结论2']
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('测试DOM加载完成！');
            
            const testBtn = document.getElementById('test-btn');
            const testTopic = document.getElementById('test-topic');
            const testResult = document.getElementById('test-result');
            const testTopicDisplay = document.getElementById('test-topic-display');
            const testRoundsDisplay = document.getElementById('test-rounds-display');
            
            testBtn.addEventListener('click', function() {
                console.log('测试按钮被点击！');
                
                const topic = testTopic.value.trim();
                if (!topic) {
                    alert('请输入话题！');
                    return;
                }
                
                console.log('测试话题:', topic);
                
                testTopicDisplay.textContent = '话题: ' + topic;
                testRoundsDisplay.textContent = '轮数: ' + testData.rounds.length + ', 结论数: ' + testData.conclusion.length;
                testResult.style.display = 'block';
                
                console.log('测试完成！');
            });
            
            console.log('测试页面初始化完成！');
        });
    </script>
</body>
</html>
