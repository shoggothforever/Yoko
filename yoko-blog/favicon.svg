<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a5ba8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="url(#redGradient)" stroke-width="3"/>
  
  <!-- 中心符号：战斗天使的剑 -->
  <g transform="translate(50,50)">
    <!-- 剑刃 -->
    <path d="M-5,-30 L0,-25 L5,-30 L0,30 Z" fill="url(#redGradient)"/>
    <!-- 剑柄 -->
    <rect x="-3" y="30" width="6" height="12" fill="#0f3460"/>
    <!-- 护手 -->
    <path d="M-12,30 L0,25 L12,30 L0,35 Z" fill="url(#purpleGradient)"/>
  </g>
  
  <!-- 装饰点 -->
  <circle cx="50" cy="15" r="3" fill="#e94560">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="85" r="3" fill="#533483">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
