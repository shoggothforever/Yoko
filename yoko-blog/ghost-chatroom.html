<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost聊天室 - 阳子 (Yoko)</title>
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="ghost-chatroom.min.css">
    <link rel="stylesheet" href="ghost-chatroom-improvements.css">
    <script src="ghost-sse.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Yoko <span class="subtitle">Blog</span></h1>
            <div class="language-switcher">
                <a href="index.html" class="language-btn">🏠 返回首页</a>
            </div>
            <div id="menu-toggle" class="menu-toggle">☰</div>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html#home">首页</a></li>
                    <li><a href="index.html#about">关于</a></li>
                    <li><a href="index.html#blog">博客</a></li>
                    <li><a href="index.html#friends">重要的人们</a></li>
                    <li><a href="ghost-chatroom.html">Ghost聊天室</a></li>
                    <li><a href="ghost-chatroom.html" onclick="showHistoryView(); return false;" id="history-link" class="active">讨论历史</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 讨论历史区 -->
        <section class="history-section" id="history-section" style="display: none;">
            <h2 class="section-title">📜 讨论历史</h2>
            <p class="section-desc">查看Ghost们之前的精彩对话（18条记录）</p>

            <!-- 加载状态 -->
            <div class="loading-state" id="history-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p>正在加载讨论历史...</p>
            </div>

            <!-- 历史记录列表 -->
            <div class="history-list" id="history-list">
                <!-- 记录卡片将通过JS动态加载 -->
            </div>

            <!-- 返回按钮 -->
            <div class="history-controls">
                <button class="secondary-btn" id="back-to-chat" onclick="showChatView()">
                    🚀 开始新的讨论
                </button>
            </div>
        </section>

        <!-- Ghost卡片展示区 -->
        <section class="ghosts-section">
            <h2 class="section-title">🌐 选择Ghost进行讨论</h2>
            <p class="section-desc" style="color:#0de334;">点击卡片选择参与讨论的Ghost（可多选）</p>

            <!-- 加载中状态 -->
            <div class="loading-state" id="loading-state" style="display: none;">
                <div class="loading-spinner"></div>
                <p>正在从数据库加载Ghost...</p>
            </div>

            <!-- Ghost卡片容器 - 支持滑动 -->
            <div class="ghosts-container" id="ghosts-container">
                <!-- 卡片将通过JS动态加载 -->
            </div>

            <!-- 左右滑动按钮 -->
            <div class="swipe-controls">
                <button class="swipe-btn" id="swipe-left" disabled>
                    <span>⬅</span>
                    <span>查看更多</span>
                </button>
                <button class="swipe-btn" id="swipe-right" disabled>
                    <span>查看更多</span>
                    <span>➡</span>
                </button>
            </div>
        </section>

        <!-- 当前选择区 -->
        <section class="selection-section" id="selection-section" style="display: none;">
            <h2 class="section-title">✓ 已选择Ghost</h2>
            <div class="selected-ghosts" id="selected-ghosts">
                <!-- 已选择的Ghost将显示在这里 -->
            </div>
        </section>

        <!-- 话题输入区 -->
        <section class="topic-section">
            <h2 class="section-title">💬 设定讨论话题</h2>
            <div class="topic-input-wrapper">
                <input type="text" id="topic-input" class="topic-input"
                       placeholder="输入你想探讨的话题，例如：当意识可以脱离肉体存在时，人类的定义是什么？"
                       maxlength="200">
            </div>
            <button class="start-btn" id="start-discussion" disabled onclick="startDiscussion()">
                🚀 开始讨论
            </button>
        </section>

        <!-- 讨论进度区 -->
        <section class="progress-section" id="progress-section" style="display: none;">
            <h2 class="section-title">⚡ 讨论进行中</h2>
            <div class="progress-info">
                <p>正在进行第 <span id="current-round">1</span> / <span id="total-rounds">6</span> 轮讨论</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
            <div class="discussion-container" id="discussion-container">
                <!-- 讨论消息将通过JS动态加载 -->
            </div>
        </section>

        <!-- 共识区 -->
        <section class="consensus-section" id="consensus-section" style="display: none;">
            <h2 class="section-title">🎯 讨论完成</h2>
            <div class="consensus-content">
                <h3>共同结论</h3>
                <div class="consensus-list" id="consensus-list">
                    <!-- 共识将通过JS动态加载 -->
                </div>
            </div>
            <button class="start-btn" id="new-discussion" onclick="resetDiscussion()">
                🔄 开始新的讨论
            </button>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 阳子 (Yoko). All rights reserved.</p>
            <p class="footer-quote">"在废墟中寻找希望，在战斗中寻找自我。"</p>
        </div>
    </footer>
    <!-- 回到顶部按钮 -->
    <button class="scroll-top" id="scroll-top" aria-label="回到顶部">↑</button>
    <script>
        // 阅读进度条
        window.addEventListener('scroll', function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const progressBar = document.getElementById('reading-progress');
            if (progressBar) {
                progressBar.style.width = scrolled + '%';
            }
        });
        
        // 回到顶部按钮
        const scrollTopBtn = document.getElementById('scroll-top');
        if (scrollTopBtn) {
            window.addEventListener('scroll', function() {
                if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                    scrollTopBtn.classList.add('visible');
                } else {
                    scrollTopBtn.classList.remove('visible');
                }
            });
            
            scrollTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
    </script>
</body>
</html>
