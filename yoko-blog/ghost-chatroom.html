<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost聊天室 - 阳子 (Yoko)</title>
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="ghost-chatroom.min.css">
    <script src="ghost-sse.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Yoko <span class="subtitle">Blog</span></h1>
            <div class="language-switcher">
                <a href="index.html" class="language-btn">🏠 返回首页</a>
            </div>
            <div id="menu-toggle" class="menu-toggle">☰</div>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html#home">首页</a></li>
                    <li><a href="index.html#about">关于</a></li>
                    <li><a href="index.html#blog">博客</a></li>
                    <li><a href="index.html#friends">重要的人们</a></li>
                    <li><a href="ghost-chatroom.html">Ghost聊天室</a></li>
                    <li><a href="ghost-chatroom.html" onclick="showHistoryView(); return false;" id="history-link" class="active">讨论历史</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 讨论历史区 -->
        <section class="history-section" id="history-section" style="display: none;">
            <h2 class="section-title">📜 讨论历史</h2>
            <p class="section-desc">查看Ghost们之前的精彩对话（18条记录）</p>

            <!-- 加载状态 -->
            <div class="loading-state" id="history-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p>正在加载讨论历史...</p>
            </div>

            <!-- 历史记录列表 -->
            <div class="history-list" id="history-list">
                <!-- 记录卡片将通过JS动态加载 -->
            </div>

            <!-- 返回按钮 -->
            <div class="history-controls">
                <button class="secondary-btn" id="back-to-chat" onclick="showChatView()">
                    🚀 开始新的讨论
                </button>
            </div>
        </section>

        <!-- Ghost卡片展示区 -->
        <section class="ghosts-section">
            <h2 class="section-title">🌐 选择Ghost进行讨论</h2>
            <p class="section-desc" style="color:#0de334;">点击卡片选择参与讨论的Ghost（可多选）</p>

            <!-- 加载中状态 -->
            <div class="loading-state" id="loading-state" style="display: none;">
                <div class="loading-spinner"></div>
                <p>正在从数据库加载Ghost...</p>
            </div>

            <!-- Ghost卡片容器 - 支持滑动 -->
            <div class="ghosts-container" id="ghosts-container">
                <!-- 卡片将通过JS动态加载 -->
            </div>

            <!-- 左右滑动按钮 -->
            <div class="swipe-controls">
                <button class="swipe-btn" id="swipe-left" disabled>
                    <span>⬅</span>
                    <span>查看更多</span>
                </button>
                <button class="swipe-btn" id="swipe-right" disabled>
                    <span>查看更多</span>
                    <span>➡</span>
                </button>
            </div>
        </section>

        <!-- 当前选择区 -->
        <section class="selection-section" id="selection-section" style="display: none;">
            <h2 class="section-title">✓ 已选择Ghost</h2>
            <div class="selected-ghosts" id="selected-ghosts">
                <!-- 已选择的Ghost将显示在这里 -->
            </div>
        </section>

        <!-- 话题输入区 -->
        <section class="topic-section">
            <h2 class="section-title">💬 设定讨论话题</h2>
            <div class="topic-input-wrapper">
                <input type="text" id="topic-input" class="topic-input"
                       placeholder="输入你想探讨的话题，例如：当意识可以脱离肉体存在时，人类的定义是什么？"
                       maxlength="200">
                <button class="start-btn" id="start-discussion" disabled>
                    🚀 开始讨论
                </button>
            </div>
        </section>

        <!-- 进度显示区 -->
        <section class="progress-section" id="progress-section" style="display: none;">
            <h2 class="section-title">⏳ 讨论进行中...</h2>
            <div class="progress-info">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p class="progress-text" id="progress-text">准备开始讨论...</p>
            </div>
        </section>

        <!-- 讨论内容区 -->
        <section class="discussion-section" id="discussion-section" style="display: none;">
            <h2 class="section-title">💬 讨论实况</h2>
            <div class="discussion-topic" id="discussion-topic"></div>
            <div class="discussion-container" id="discussion-container"></div>
        </section>

        <!-- 共识区 -->
        <section class="consensus-section" id="consensus-section" style="display: none;">
            <h2 class="section-title">🤝 达成共识</h2>
            <div class="consensus-content">
                <ul class="consensus-list" id="consensus-list"></ul>
            </div>
            <button class="start-btn" onclick="location.reload()">
                🔄 开始新的讨论
            </button>
        </section>
    </main>

    <script>
    console.log('ghost-chatroom.html 内嵌脚本开始执行');
    console.log('loadGhostsWithRetry 函数是否存在:', typeof loadGhostsWithRetry);

    // 应用状态
    let allGhosts = [];
    let selectedGhosts = [];
    let currentPage = 0;
    const GHOSTS_PER_PAGE = 6;
    let isLoading = false;

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        initApp();
    });

    async function initApp() {
        console.log('开始初始化应用...');
        console.log('loadGhostsWithRetry 函数类型:', typeof loadGhostsWithRetry);

        if (typeof loadGhostsWithRetry !== 'function') {
            console.error('loadGhostsWithRetry 函数不存在！');
            showErrorMessage('初始化失败：API 函数未加载');
            return;
        }

        try {
            await loadGhostsWithRetry(
                // onLoading
                (loading) => {
                    showLoading(loading);
                    if (loading) {
                        hideSection('ghosts-section');
                    } else {
                        showSection('ghosts-section');
                    }
                },
                // onSuccess
                (ghosts) => {
                    allGhosts = ghosts;
                    renderGhosts();

                    if (allGhosts.length === 0) {
                        showErrorMessage('无法加载Ghost数据，请检查服务器是否运行');
                    }
                },
                // onError
                (error) => {
                    showErrorMessage('加载失败：' + error.message);
                }
            );

            initEventListeners();
            console.log('应用初始化完成');
        } catch (error) {
            console.error('初始化失败:', error);
            showErrorMessage('初始化失败，请刷新页面重试');
        }
    }

    function renderGhosts() {
        const container = document.getElementById('ghosts-container');
        container.innerHTML = '';

        const startIndex = currentPage * GHOSTS_PER_PAGE;
        const endIndex = Math.min(startIndex + GHOSTS_PER_PAGE, allGhosts.length);
        const ghostsToShow = allGhosts.slice(startIndex, endIndex);

        ghostsToShow.forEach(ghost => {
            const isSelected = selectedGhosts.includes(ghost.id);
            const card = createGhostCard(ghost, isSelected);
            container.appendChild(card);
        });

        // 更新滑动按钮状态
        updateSwipeControls();
    }

    function createGhostCard(ghost, isSelected = false) {
        const card = document.createElement('div');
        card.className = `ghost-card ${isSelected ? 'selected' : ''}`;
        card.dataset.ghostId = ghost.id;

        card.innerHTML = `
            <div class="ghost-icon">${ghost.icon || '👤'}</div>
            <div class="ghost-info">
                <h3 class="ghost-name">${ghost.display_name}</h3>
                <p class="ghost-source">${ghost.source || '未知来源'}</p>
                <p class="ghost-description">${ghost.description || ''}</p>
            </div>
        `;

        card.addEventListener('click', () => {
            if (!isLoading) {
                toggleGhostSelection(ghost.id);
            }
        });

        return card;
    }

    function toggleGhostSelection(ghostId) {
        if (selectedGhosts.includes(ghostId)) {
            selectedGhosts = selectedGhosts.filter(id => id !== ghostId);
        } else {
            selectedGhosts.push(ghostId);
        }

        console.log('当前选择:', selectedGhosts);
        renderGhosts();
        updateSelectedGhostsDisplay();
        updateStartButton();
    }

    function updateSwipeControls() {
        const leftBtn = document.getElementById('swipe-left');
        const rightBtn = document.getElementById('swipe-right');

        leftBtn.disabled = currentPage === 0;
        rightBtn.disabled = (currentPage + 1) * GHOSTS_PER_PAGE >= allGhosts.length;
    }

    function swipeLeft() {
        if (currentPage > 0) {
            currentPage--;
            renderGhosts();
        }
    }

    function swipeRight() {
        const maxPage = Math.ceil(allGhosts.length / GHOSTS_PER_PAGE) - 1;
        if (currentPage < maxPage) {
            currentPage++;
            renderGhosts();
        }
    }

    function updateSelectedGhostsDisplay() {
        const section = document.getElementById('selection-section');
        const container = document.getElementById('selected-ghosts');

        if (selectedGhosts.length === 0) {
            hideSection('selection-section');
            return;
        }

        showSection('selection-section');
        container.innerHTML = '';

        selectedGhosts.forEach(ghostId => {
            const ghost = allGhosts.find(g => g.id === ghostId);
            if (ghost) {
                const item = document.createElement('div');
                item.className = 'selected-ghost-item';
                item.innerHTML = `
                    <span class="ghost-icon">${ghost.icon || '👤'}</span>
                    <span class="ghost-name">${ghost.display_name}</span>
                `;
                container.appendChild(item);
            }
        });
    }

    function initEventListeners() {
        // 滑动按钮
        document.getElementById('swipe-left').addEventListener('click', () => {
            if (!isLoading) {
                swipeLeft();
            }
        });
        document.getElementById('swipe-right').addEventListener('click', () => {
            if (!isLoading) {
                swipeRight();
            }
        });

        // 话题输入
        const topicInput = document.getElementById('topic-input');
        const startBtn = document.getElementById('start-discussion');

        topicInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startDiscussion();
            }
        });

        startBtn.addEventListener('click', startDiscussion);
    }

    async function startDiscussion() {
        const topic = topicInput.value.trim();

        if (!topic || selectedGhosts.length === 0) {
            alert('❌ 请输入话题并选择Ghost！');
            return;
        }

        // 禁用UI，显示进度
        disableUI(true);
        hideSection('ghosts-section');
        hideSection('selection-section');
        hideSection('topic-section');
        showSection('progress-section');

        updateProgress(0, '正在创建讨论会话...');
        isLoading = true;

        try {
            // 调用 ghost.min.js 中的 API 函数
            const session = await startDiscussionApi(topic, selectedGhosts, 'web_user', 6);

            // 显示讨论区
            showSection('discussion-section');
            updateProgress(10, 'Ghost们开始发表观点...');

            // 开始监听讨论进度 - 使用SSE实现推送
            await monitorDiscussionProgressSSE(
                session.session_id,
                // onNewMessage
                (message) => {
                    addMessageToDisplay(message);

                    // 滚动到底部
                    const logArea = document.getElementById('discussion-container');
                    logArea.scrollTop = logArea.scrollHeight;
                },
                // onComplete
                (data) => {
                    showResult(data);
                },
                // onProgress
                (percent, text) => {
                    updateProgress(percent, text);
                },
                // onError
                (error) => {
                    console.error('讨论错误:', error);
                }
            );

        } catch (error) {
            console.error('讨论启动失败:', error);
            alert('❌ 讨论启动失败：' + error.message);
            isLoading = false;

            // 恢复UI
            disableUI(false);
            showSection('ghosts-section');
            showSection('selection-section');
            showSection('topic-section');
            hideSection('progress-section');
        }
    }

    function addMessageToDisplay(message) {
        const container = document.getElementById('discussion-container');
        const topicDiv = document.getElementById('discussion-topic');

        // 第一次添加话题
        if (container.children.length === 0 && message.round_number === 1) {
            const session = getCurrentSession();
            topicDiv.textContent = `💬 话题：${session ? session.topic : ''}`;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message-card';

        const isSummary = message.ghost_name && message.ghost_name.includes('总结');

        messageDiv.innerHTML = `
            <div class="message-header ${isSummary ? 'summary' : ''}">
                <span class="message-avatar">${message.ghost_icon || '👤'}</span>
                <span class="message-name">${message.ghost_name || '系统'}</span>
                <span class="message-round">第${message.round_number}轮</span>
            </div>
            <div class="message-content">
                ${message.content.split('\n').map(p => `<p>${p}</p>`).join('')}
            </div>
        `;

        container.appendChild(messageDiv);
    }

    function showResult(data) {
        isLoading = false;

        hideUpdateSection('progress-section');
        hideUpdateSection('discussion-section');
        showSection('consensus-section');

        const consensusList = document.getElementById('consensus-list');
        const consensus = data.consensus || {};
        const points = Array.isArray(consensus.points)
            ? consensus.points
            : (consensus.point || []);

        points.forEach((point, index) => {
            const li = document.createElement('li');
            li.className = 'consensus-item';
            li.innerHTML = `<span class="consensus-number">${index + 1}.</span> ${point}`;
            consensusList.appendChild(li);
        });
    }

    function showSection(sectionId) {
        let section = document.getElementById(sectionId);
        if (section != null) {
            section.style.display = 'block';
        }
    }

    function hideSection(sectionId) {
        let section = document.getElementById(sectionId);
        if (section != null) {
            section.style.display = 'none';
        }
    }

    function updateProgress(percent, text) {
        const fill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');

        fill.style.width = percent + '%';
        progressText.textContent = text;
    }

    function showLoading(show) {
        const loadingState = document.getElementById('loading-state');
        loadingState.style.display = show ? 'block' : 'none';
    }

    function showErrorMessage(message) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.textContent = '❌ ' + message;
        document.querySelector('.container').appendChild(errorDiv);

        setTimeout(() => {
            errorDiv.remove();
        }, 5000);
    }

    function updateStartButton() {
        const startBtn = document.getElementById('start-discussion');
        if (selectedGhosts.length > 0) {
            startBtn.disabled = false;
            startBtn.textContent = `🚀 开始讨论 (${selectedGhosts.length}个Ghost)`;
        } else {
            startBtn.disabled = true;
            startBtn.textContent = '🚀 请先选择Ghost';
        }
    }

    function disableUI(disabled) {
        document.querySelectorAll('.ghost-card, .topic-input, .start-btn, .swipe-btn').forEach(el => {
            el.disabled = disabled;
        });

        // 保持开始按钮可用，除非被完全禁用
        if (!disabled) {
            document.getElementById('start-discussion').disabled = false;
        }
    }

    // ========== 讨论历史功能 ==========

    // 加载讨论历史
    async function loadDiscussionHistory() {
        try {
            const response = await fetch('http://118.145.99.224:8080/api/chat/history?limit=20');
            const result = await response.json();

            if (result.success && result.data) {
                console.log('讨论历史加载成功:', result.data.records.length + '条记录');
                renderHistoryList(result.data.records);
            } else {
                throw new Error(result.message || '加载失败');
            }
        } catch (error) {
            console.error('加载讨论历史失败:', error);
            showErrorMessage('加载讨论历史失败：' + error.message);
        }
    }

    // 渲染历史列表
    function renderHistoryList(records) {
        const container = document.getElementById('history-list');
        container.innerHTML = '';

        if (records.length === 0) {
            container.innerHTML = '<p class="empty-state">暂无讨论记录</p>';
            return;
        }

        records.forEach(record => {
            const card = createHistoryCard(record);
            container.appendChild(card);
        });
    }

    // 创建历史记录卡片
    function createHistoryCard(record) {
        const card = document.createElement('div');
        card.className = 'history-card';

        // 解析内容（提取Ghost参与情况）
        const ghosts = extractGhostsFromContent(record.content);
        const date = record.date || '未知日期';

        card.innerHTML = `
            <div class="history-header">
                <h3 class="history-title">${record.topic || '未知话题'}</h3>
                <p class="history-date">${date}</p>
            </div>
            <div class="history-ghosts">
                ${ghosts.map(g => `<span class="history-ghost-badge">${g.icon} ${g.name}</span>`).join('')}
            </div>
            <div class="history-actions">
                <button class="history-btn view-btn" onclick="viewDiscussionRecord('${record.fileName}')">
                    👁 查看完整对话
                </button>
            </div>
        `;

        return card;
    }

    // 从MD内容中提取Ghost参与情况
    function extractGhostsFromContent(content) {
        const ghosts = [];
        const ghostPatterns = [
            { name: 'Gally', icon: '🦊', pattern: /第\d+轮 - Gally/g },
            { name: 'Motoko', icon: '👤', pattern: /第\d+轮 - Motoko/g },
            { name: 'Nova', icon: '🤖', pattern: /第\d+轮 - Nova/g }
        ];

        ghostPatterns.forEach(ghost => {
            if (ghost.pattern.test(content)) {
                ghosts.push(ghost);
            }
        });

        // 如果没有找到Ghost，尝试从其他模式提取
        if (ghosts.length === 0) {
            if (content.includes('Galley') || content.includes('galley')) {
                ghosts.push({ name: 'Galley', icon: '🦊' });
            }
            if (content.includes('Motoko') || content.includes('motoko')) {
                ghosts.push({ name: 'Motoko', icon: '👤' });
            }
        }

        return ghosts;
    }

    // 查看单个讨论记录
    async function viewDiscussionRecord(filename) {
        try {
            const response = await fetch(`http://118.145.99.224:8080/api/chat/history/${filename}`);
            const result = await response.json();

            if (result.success && result.data) {
                showDiscussionRecordContent(result.data.content);
            } else {
                throw new Error(result.message || '加载失败');
            }
        } catch (error) {
            console.error('查看讨论记录失败:', error);
            showErrorMessage('查看讨论记录失败：' + error.message);
        }
    }

    // 显示讨论记录内容
    function showDiscussionRecordContent(content) {
        // 使用模态框显示内容
        const modal = document.createElement('div');
        modal.className = 'history-modal-overlay';

        modal.innerHTML = `
            <div class="history-modal">
                <div class="modal-header">
                    <h2>📜 讨论对话</h2>
                    <button class="modal-close" onclick="this.closest('.history-modal-overlay').remove()">
                        ✕ 关闭
                    </button>
                </div>
                <div class="modal-content">
                    <pre class="markdown-content">${escapeHtml(content)}</pre>
                </div>
            </div>
        `;

        document.body.appendChild(modal);

        // 点击背景关闭
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.remove();
            }
        });
    }

    // HTML转义
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    // 切换到讨论历史视图
    function showHistoryView() {
        hideUpdateSection('ghosts-section');
        hideUpdateSection('selection-section');
        hideUpdateSection('topic-section');
        hideUpdateSection('progress-section');
        hideUpdateSection('discussion-section');
        hideUpdateSection('consensus-section');
        showSection('history-section');

        // 更新导航链接
        document.querySelectorAll('#nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById('history-link').classList.add('active');

        // 加载讨论历史
        loadDiscussionHistory();
    }

    // 切换到聊天视图
    function showChatView() {
        hideUpdateSection('history-section');
        showSection('ghosts-section');
        showSection('selection-section');
        showSection('topic-section');

        // 更新导航链接
        document.querySelectorAll('#nav-menu a').forEach(a => a.classList.remove('active'));
        document.querySelector('#nav-menu a[href="ghost-chatroom.html"]').classList.add('active');
    }

    function hideUpdateSection(sectionId) {
        let section = document.getElementById(sectionId);
        if (section != null) {
            section.style.display = 'none';
        }
    }

    console.log('ghost-chatroom.html 脚本初始化完成');
    </script>
</body>
</html>
